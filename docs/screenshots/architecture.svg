<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1100" height="640" rx="16" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">PointBridge: one reusable service, two independent monoliths</text>

  <!-- Monolith 1 -->
  <rect x="30" y="50" width="300" height="240" rx="12" fill="#fdf2f8" stroke="#e0007a" stroke-width="2"/>
  <text x="45" y="74" font-size="14" font-weight="700" fill="#9d174d">MONOLITH #1 · Brew &amp; Bean Café :3001</text>
  <rect x="50" y="88" width="260" height="40" rx="8" fill="#fff" stroke="#f9a8d4"/><text x="180" y="113" text-anchor="middle" font-size="13" fill="#0f172a">Own UI · menu, cart, receipt</text>
  <rect x="50" y="140" width="260" height="40" rx="8" fill="#fff" stroke="#f9a8d4"/><text x="180" y="165" text-anchor="middle" font-size="13" fill="#0f172a">Own server · Express</text>
  <rect x="50" y="192" width="260" height="80" rx="8" fill="#fff" stroke="#f9a8d4"/><text x="180" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Own DB · cafe.db</text><text x="180" y="247" text-anchor="middle" font-size="12" fill="#475569">menu_items, orders (no points)</text>

  <!-- Monolith 2 -->
  <rect x="30" y="340" width="300" height="240" rx="12" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="45" y="364" font-size="14" font-weight="700" fill="#0f172a">MONOLITH #2 · Starlight Cinemas :3002</text>
  <rect x="50" y="378" width="260" height="40" rx="8" fill="#fff" stroke="#94a3b8"/><text x="180" y="403" text-anchor="middle" font-size="13" fill="#0f172a">Own UI · movies, seats, ticket</text>
  <rect x="50" y="430" width="260" height="40" rx="8" fill="#fff" stroke="#94a3b8"/><text x="180" y="455" text-anchor="middle" font-size="13" fill="#0f172a">Own server · Express</text>
  <rect x="50" y="482" width="260" height="80" rx="8" fill="#fff" stroke="#94a3b8"/><text x="180" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Own DB · cinema.db</text><text x="180" y="537" text-anchor="middle" font-size="12" fill="#475569">movies, shows, bookings (no points)</text>

  <!-- Shared client library -->
  <rect x="410" y="250" width="210" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="515" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">loyalty-client</text>
  <text x="515" y="300" text-anchor="middle" font-size="12" fill="#065f46">shared library used by both</text>
  <text x="515" y="320" text-anchor="middle" font-size="12" fill="#334155">REST client · settlePurchase</text>
  <text x="515" y="338" text-anchor="middle" font-size="12" fill="#334155">live feed · browser widget</text>

  <!-- Service -->
  <rect x="700" y="130" width="370" height="270" rx="12" fill="#f5f3ff" stroke="#7000ff" stroke-width="2"/>
  <text x="715" y="154" font-size="14" font-weight="700" fill="#5b21b6">REUSABLE SERVICE</text>
  <rect x="720" y="168" width="330" height="120" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="885" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Loyalty Points Service :5001</text>
  <text x="740" y="216" font-size="12" fill="#334155">• REST contract: enroll, earn, redeem, history</text>
  <text x="740" y="236" font-size="12" fill="#334155">• Client registry: X-Client-Id + X-Api-Key</text>
  <text x="740" y="256" font-size="12" fill="#334155">• Business rules: ₹10 = 1 pt, Gold tier, no overdraft</text>
  <text x="740" y="276" font-size="12" fill="#334155">• Idempotent (source, type, reference)</text>
  <rect x="720" y="302" width="330" height="80" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="885" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">loyalty.db · single source of truth</text>
  <text x="885" y="356" text-anchor="middle" font-size="12" fill="#475569">members, ledger</text>

  <!-- Bus -->
  <rect x="700" y="470" width="370" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="885" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Event Bus :5002 · publish / subscribe</text>
  <text x="885" y="528" text-anchor="middle" font-size="12" fill="#334155">MemberEnrolled · PointsEarned · PointsRedeemed</text>

  <!-- Calls -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M310,152 C360,152 360,285 408,285"/>
    <path d="M310,442 C360,442 360,335 408,335"/>
    <path d="M620,310 C660,310 660,228 718,228"/>
  </g>
  <text x="628" y="345" font-size="11" fill="#334155">REST + API key</text>
  <text x="352" y="230" font-size="11" fill="#334155" transform="rotate(90 352 230)">import</text>

  <!-- Events -->
  <g stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#e)">
    <path d="M885,400 L885,468"/>
    <path d="M700,520 L385,520 L385,462 L312,462"/>
    <path d="M700,545 L395,545 L395,600 L20,600 L20,170 L28,170"/>
  </g>
  <text x="893" y="440" font-size="11" fill="#92400e">publish after commit</text>
  <text x="560" y="514" text-anchor="middle" font-size="11" fill="#92400e">live events → SSE to the page</text>
  <text x="200" y="618" text-anchor="middle" font-size="11" fill="#92400e">live events → SSE to the page</text>
</svg>
